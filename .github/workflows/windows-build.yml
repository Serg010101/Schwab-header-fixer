name: Build Windows EXE

on:
  # Manual "Run workflow" button
  workflow_dispatch:
  # Automatically when you publish a GitHub Release
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: pyinstaller --onefile combine_headers.py -n SchwabHeaderFixer

      # So you can download from the Actions page
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchwabHeaderFixer-windows
          path: dist/SchwabHeaderFixer.exe

      # When run from a Release, attach EXE to that Release automatically
      - name: Attach EXE to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SchwabHeaderFixer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}